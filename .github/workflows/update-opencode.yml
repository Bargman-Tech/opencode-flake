name: Update OpenCode

# The daily cron is disabled: there is no version string and no release-asset
# hash left to refresh. The version is derived from the upstream source's own
# packages/opencode/package.json, and the dependency tree from its bun.lock, so
# the only legitimate bump is the `opencode` INPUT REV in flake.nix followed by
# a re-lock (`./update.sh`). A scheduled job that sedded a version or rewrote a
# release-asset hash would reintroduce exactly the pin model this flake removed.
#
# Dispatch is manual on purpose: it opens a commit and a tag, and a human
# should decide when the fleet moves. If it is ever scheduled again, it must
# call ./update.sh and nothing else — never a version sed, never a hash.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to move the input to (optional, e.g. 1.19.3)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump the opencode input rev
        id: update-check
        run: |
          set -euo pipefail
          chmod +x ./update.sh

          # Only one code path exists: the input-rev bump. ./update.sh refuses
          # to write a `version =` line, by design.
          ./update.sh "${{ github.event.inputs.version }}"

          if git diff --quiet -- flake.nix flake.lock; then
            echo "No input change - already at the requested upstream rev"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SYSTEM=$(nix eval --raw --impure --expr builtins.currentSystem)
          VERSION=$(nix eval --raw ".#packages.${SYSTEM}.opencode.version" --option builders '')
          REV=$(grep -oP 'github:anomalyco/opencode/\K[0-9a-f]{40}' flake.nix | head -1)
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Moved the opencode input to ${REV} (derived version ${VERSION})"

      - name: Build and validate
        if: steps.update-check.outputs.has-changes == 'true'
        run: |
          set -euo pipefail
          nix build .#opencode -L --option builders ''
          ./result/bin/opencode --version
          nix flake check -L --option builders ''

      - name: Commit, tag, and push
        if: steps.update-check.outputs.has-changes == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.update-check.outputs.version }}"
          REV="${{ steps.update-check.outputs.rev }}"

          git add flake.nix flake.lock
          git commit -m "$(cat <<EOF
          Bump the opencode input to ${REV}

          - Source input rev moved (upstream v${VERSION}); the version is
            derived from the source's package.json, not written here
          - Dependency set re-derived from the source's bun.lock
          EOF
          )"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag -f -a "v${VERSION}" -m "OpenCode Flake version ${VERSION}"
          else
            git tag -a "v${VERSION}" -m "OpenCode Flake version ${VERSION}"
          fi

          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${VERSION}" --force-with-lease || git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: steps.update-check.outputs.has-changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.update-check.outputs.version }}
          name: OpenCode Flake ${{ steps.update-check.outputs.version }}
          body: |
            OpenCode Flake version ${{ steps.update-check.outputs.version }}

            Builds [OpenCode](https://github.com/anomalyco/opencode) v${{ steps.update-check.outputs.version }} **from source** in Nix, so patches apply.

            ## Install

            ```bash
            nix run github:Bargman-Tech/opencode-flake
            ```
          draft: false
          prerelease: false

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.update-check.outputs.has-changes }}" = "true" ]; then
            echo "Updated the opencode input to ${{ steps.update-check.outputs.rev }} (version ${{ steps.update-check.outputs.version }})"
          else
            echo "Already at the requested upstream rev (or no change)"
          fi
